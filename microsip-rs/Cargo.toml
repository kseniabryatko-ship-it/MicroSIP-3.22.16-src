[workspace]
resolver = "2"
members = ["crates/microsip-core"]

# The program people run: optimised across its libraries and without the
# names kept for debugging, so it comes out smaller. "thin" does this in
# pieces on every core of the computer at once (Cargo counts them itself),
# so a build stays quick; the program is a little larger than with the
# slow whole-program setting, about 10 MB instead of 8.
[profile.release]
lto = "thin"
strip = true

# Speech codecs do a lot of arithmetic per packet. Tests are built without
# optimisation, which makes the Speex encoder too slow for a live call, so
# the codec libraries are optimised there too.
[profile.dev.package.oxideav-speex]
opt-level = 3

[profile.dev.package.oxideav-gsm]
opt-level = 3

[profile.dev.package.oxideav-core]
opt-level = 3
